<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive website page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">MySite</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- HERO -->
  <section id="home" class="hero">
    <div class="hero-text">
      <h1>Build Your Dream Website</h1>
      <p>Responsive design using Flexbox & Grid</p>
      <button>Get Started</button>
    </div>
  </section>

  <!-- SERVICES -->
  <section id="services" class="services">
    <h2>Our Services</h2>
    <div class="service-grid">
      <div class="card">Web Design</div>
      <div class="card">Development</div>
      <div class="card">SEO</div>
      <div class="card">Support</div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about" class="about">
    <h2>About Us</h2>
    <p>We create modern and responsive websites.</p>
  </section>

  <!-- TESTIMONIALS -->
  <section class="testimonials">
    <h2>Testimonials</h2>
    <div class="testimonial-box">
      <p>"Amazing work!"</p>
      <h4>- Client</h4>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer" id="contact">
    <p>© 2026 MySite. All rights reserved.</p>
  </footer>

</body>
</html>
